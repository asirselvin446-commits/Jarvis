<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AETHER | Agentic Interface</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    body {
        background-color: #050505;
        color: #e3e2e2;
        overflow: hidden;
        font-family: 'Space Grotesk', sans-serif;
    }
    .glass-panel {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .waveform-container { filter: drop-shadow(0 0 15px rgba(0, 242, 255, 0.2)); }
    .waveform-listening { filter: drop-shadow(0 0 25px rgba(220, 184, 255, 0.4)); }
    .waveform-processing { filter: drop-shadow(0 0 25px rgba(0, 242, 255, 0.4)); }
    
    .glow-dot {
        box-shadow: 0 0 10px rgba(0, 242, 255, 0.6);
        animation: pulse 3s infinite ease-in-out;
    }
    .glow-dot-speaking {
        background-color: #dcb8ff !important;
        box-shadow: 0 0 10px rgba(220, 184, 255, 0.6);
    }
    @keyframes pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.2); }
    }
    .noise-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.02;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }
    
    /* Scrollbars */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
    
    /* Chat message entry animation */
    .msg-enter { animation: msg-slide-in 0.3s ease-out; }
    @keyframes msg-slide-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Ambient VAD Animation */
    .bar {
        width: 2px;
        background: #00dbe7;
        border-radius: 2px;
        transition: height 0.2s ease, background 0.3s ease;
    }
    .bar-speaking {
        background: #dcb8ff;
    }
    .ws-disconnected { color: #ffb4ab; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
</style>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      "colors": {
              "primary-fixed-dim": "#00dbe7",
              "primary": "#e1fdff",
              "error": "#ffb4ab",
              "surface-dim": "#121414",
              "secondary": "#dcb8ff",
      },
      "fontFamily": {
              "display-xl": ["Space Grotesk"],
              "label-sm": ["Space Grotesk"]
      },
      "spacing": {
              "margin-edge": "64px",
              "section-gap": "128px",
      }
    }
  }
}
</script>
</head>
<body class="bg-surface-dim selection:bg-primary/20 text-white select-none">
<div class="noise-overlay z-0"></div>

<!-- Background Glow -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
  <div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-primary-fixed-dim/5 blur-[120px]"></div>
  <div class="absolute -bottom-[20%] -right-[10%] w-[50%] h-[50%] rounded-full bg-primary-fixed-dim/5 blur-[100px]"></div>
</div>

<!-- Header -->
<header class="flex justify-between items-center w-full px-8 py-6 fixed top-0 z-50 bg-transparent">
  <div class="text-[20px] font-medium tracking-[0.2em] text-primary-fixed-dim drop-shadow-[0_0_8px_rgba(0,219,231,0.4)] flex items-center gap-3">
    <span class="material-symbols-outlined text-[24px]">memory</span>
    AETHER CORE
  </div>
  <div class="flex items-center gap-6">
    <button id="btn-mic" class="text-primary-fixed-dim hover:text-primary transition-all p-2 rounded-full border border-primary-fixed-dim/20 hover:bg-primary-fixed-dim/10 flex items-center justify-center cursor-pointer">
        <span id="mic-icon" class="material-symbols-outlined">mic</span>
    </button>
    <span id="ws-indicator" class="material-symbols-outlined text-[16px] ws-disconnected" title="WebSocket">sensors</span>
  </div>
</header>

<!-- Left Sidebar (Static Aesthetics) -->
<aside class="fixed left-0 top-0 h-full pt-32 pb-8 flex flex-col justify-between z-40 bg-white/[0.02] backdrop-blur-3xl border-r border-white/5 w-64 px-8">
  <div class="flex flex-col gap-12">
    <div class="space-y-1">
      <h2 class="text-[24px] font-light text-primary">J.A.R.V.I.S.</h2>
      <p class="text-[10px] tracking-[0.2em] opacity-50 uppercase">Neural OS Active</p>
    </div>
    <nav class="flex flex-col gap-6">
      <a class="text-primary-fixed-dim border-l-2 border-primary-fixed-dim pl-4 flex items-center gap-4 transition-all uppercase tracking-[0.1em] text-[12px]" href="#">
        <span class="material-symbols-outlined text-[18px]">psychology</span>
        Cognition
      </a>
      <a class="text-white/50 pl-4 flex items-center gap-4 hover:text-primary transition-all uppercase tracking-[0.1em] text-[12px]" href="#">
        <span class="material-symbols-outlined text-[18px]">history_edu</span>
        Archive
      </a>
      <a class="text-white/50 pl-4 flex items-center gap-4 hover:text-primary transition-all uppercase tracking-[0.1em] text-[12px]" href="#">
        <span class="material-symbols-outlined text-[18px]">tune</span>
        Config
      </a>
    </nav>
  </div>
</aside>

<!-- Main Canvas -->
<main class="ml-64 mr-[400px] h-screen relative flex flex-col items-center justify-center z-10">
  <div class="flex flex-col items-center justify-center gap-16 mb-24">
    <!-- Waveform -->
    <div class="relative w-96 h-32 flex items-center justify-center gap-[2px] waveform-container" id="visualizer">
      <!-- Bars via JS -->
    </div>
    <!-- Status Text -->
    <div class="text-center space-y-4">
      <div class="flex items-center justify-center gap-3">
        <div id="status-led" class="w-2 h-2 rounded-full bg-primary-fixed-dim glow-dot"></div>
        <span id="status-text" class="text-[10px] tracking-[0.4em] text-primary-fixed-dim uppercase">AMBIENT VAD READY</span>
      </div>
      <h1 id="pipeline-text" class="text-[64px] font-light text-primary/80 tracking-wide">Aether</h1>
    </div>
  </div>
</main>

<!-- Right Sidebar (Repurposed as Chat Log) -->
<div class="fixed right-8 top-1/2 -translate-y-1/2 w-[350px] h-[600px] glass-panel rounded-xl flex flex-col z-40">
  <div class="flex justify-between items-center p-6 border-b border-white/5 bg-black/20 rounded-t-xl">
    <span class="text-[10px] tracking-[0.2em] opacity-40 uppercase">TERMINAL LOG</span>
    <button id="btn-clear" class="material-symbols-outlined text-[16px] opacity-40 hover:opacity-100 hover:text-primary-fixed-dim transition-all cursor-pointer">delete_sweep</button>
  </div>
  
  <div id="chat-log" class="flex-grow overflow-y-auto p-6 relative">
    <div id="chat-messages" class="space-y-4">
      <div class="msg-enter flex flex-col gap-1 border-l border-primary-fixed-dim/40 pl-3">
        <span class="text-[9px] font-bold text-primary-fixed-dim tracking-[0.15em] uppercase">System</span>
        <p class="text-[13px] text-white/80 font-mono tracking-tight leading-relaxed">J.A.R.V.I.S. Aether UI initialized. Say <span class="text-primary font-bold">"Hey Jarvis"</span> to begin.</p>
      </div>
    </div>
  </div>
</div>

<!-- Bottom Footer (Input & Live Transcript) -->
<footer class="fixed bottom-0 left-0 w-full pl-[288px] pr-8 py-4 flex justify-between items-center z-50 backdrop-blur-md border-t border-white/5 bg-transparent">
  
  <div class="flex-1 max-w-xl flex items-center gap-4">
    <!-- Live Transcript -->
    <div id="live-transcript" class="hidden flex items-center gap-3 flex-1 overflow-hidden">
      <span class="w-1.5 h-1.5 bg-primary-fixed-dim rounded-full animate-pulse flex-shrink-0"></span>
      <span id="live-transcript-text" class="text-[12px] font-mono text-primary-fixed-dim truncate opacity-80 uppercase tracking-wider"></span>
    </div>

    <!-- Command Input -->
    <div id="input-container" class="flex-1 flex items-center gap-2 glass-panel rounded-md px-4 py-2 opacity-50 focus-within:opacity-100 transition-opacity">
      <input id="command-input" class="w-full bg-transparent border-none focus:outline-none focus:ring-0 text-[12px] font-mono text-primary placeholder:text-white/20" placeholder="Agentic override command..." type="text" autocomplete="off" />
      <button id="send-btn" class="material-symbols-outlined text-[16px] text-white/40 hover:text-primary-fixed-dim cursor-pointer">send</button>
    </div>
  </div>

  <div class="flex gap-8 text-[10px] font-mono tracking-widest text-white/30 uppercase pl-8">
    <span>LATENCY: 12ms</span>
    <span>UPTIME: 99.9%</span>
  </div>
</footer>

<script>
// ═══════════════════════════════════════════════════════════════
// UI Animation & Setup
// ═══════════════════════════════════════════════════════════════
const visualizer = document.getElementById('visualizer');
const barCount = 45;
const bars = [];
let pipelineState = 'idle';
let pipelineRunning = false;

// Generate bars
for (let i = 0; i < barCount; i++) {
    const bar = document.createElement('div');
    bar.className = 'bar';
    const baseHeight = 4 + Math.random() * 8;
    bar.style.height = baseHeight + 'px';
    bar.style.opacity = (0.1 + (i / barCount) * 0.9).toString();
    visualizer.appendChild(bar);
    bars.push({ el: bar, base: baseHeight, noiseOffset: i * 0.5 });
}

function animateBars() {
    let multiplier = 1;
    if (pipelineState === 'listening' || pipelineState === 'follow_up') multiplier = 6;
    if (pipelineState === 'processing') multiplier = 3;
    if (pipelineState === 'speaking') multiplier = 5;

    bars.forEach((bar) => {
        const speed = pipelineState === 'ambient' ? 0.002 : 0.01;
        const noise = Math.sin(Date.now() * speed + bar.noiseOffset) * 10 * multiplier;
        const dynamicHeight = Math.max(4, bar.base + noise);
        bar.el.style.height = dynamicHeight + 'px';
    });
    requestAnimationFrame(animateBars);
}
animateBars();

// ═══════════════════════════════════════════════════════════════
// WebSocket Logic
// ═══════════════════════════════════════════════════════════════
const input = document.getElementById('command-input');
const sendBtn = document.getElementById('send-btn');
const micBtn = document.getElementById('btn-mic');
const micIcon = document.getElementById('mic-icon');
const clearBtn = document.getElementById('btn-clear');
const chatMessages = document.getElementById('chat-messages');
const chatLog = document.getElementById('chat-log');
const statusLed = document.getElementById('status-led');
const statusText = document.getElementById('status-text');
const pipelineText = document.getElementById('pipeline-text');
const wsIndicator = document.getElementById('ws-indicator');
const liveTranscript = document.getElementById('live-transcript');
const liveTranscriptText = document.getElementById('live-transcript-text');
const inputContainer = document.getElementById('input-container');

let ws = null;
let wsReconnectTimer = null;

function scrollToBottom() {
  requestAnimationFrame(() => { chatLog.scrollTop = chatLog.scrollHeight; });
}

function addMessage(sender, text, type = 'system') {
  const msg = document.createElement('div');
  msg.className = 'msg-enter flex flex-col gap-1 border-l pl-3 py-1';
  
  let borderColor, labelColor, textColor;
  switch(type) {
    case 'user':
      borderColor = 'border-white/30';
      labelColor = 'text-white/60';
      textColor = 'text-white/90';
      break;
    case 'error':
      borderColor = 'border-error/40';
      labelColor = 'text-error';
      textColor = 'text-error/90';
      break;
    default:
      borderColor = 'border-primary-fixed-dim/40';
      labelColor = 'text-primary-fixed-dim';
      textColor = 'text-primary/90';
  }

  msg.classList.add(borderColor);
  msg.innerHTML = `
    <span class="text-[9px] font-bold ${labelColor} tracking-[0.15em] uppercase">${sender}</span>
    <p class="text-[13px] ${textColor} font-mono tracking-tight leading-relaxed whitespace-pre-wrap">${text}</p>
  `;
  chatMessages.appendChild(msg);
  scrollToBottom();
  return msg;
}

function setPipelineState(state) {
  pipelineState = state;
  
  const resetColors = () => {
      visualizer.classList.remove('waveform-listening', 'waveform-processing');
      statusLed.classList.remove('glow-dot-speaking');
      bars.forEach(b => b.el.classList.remove('bar-speaking'));
  };
  
  resetColors();

  switch(state) {
    case 'ambient':
      statusText.textContent = 'AMBIENT VAD READY';
      pipelineText.textContent = 'Aether';
      pipelineText.style.opacity = '0.3';
      micIcon.textContent = 'mic';
      hideLiveTranscript();
      break;

    case 'listening':
      statusText.textContent = 'LISTENING';
      pipelineText.textContent = 'Listening...';
      pipelineText.style.opacity = '0.8';
      visualizer.classList.add('waveform-listening');
      micIcon.textContent = 'hearing';
      break;

    case 'processing':
      statusText.textContent = 'PROCESSING';
      pipelineText.textContent = 'Processing...';
      pipelineText.style.opacity = '0.8';
      visualizer.classList.add('waveform-processing');
      micIcon.textContent = 'neurology';
      hideLiveTranscript();
      break;

    case 'speaking':
      statusText.textContent = 'SPEAKING / FULL-DUPLEX READY';
      pipelineText.textContent = 'Speaking...';
      pipelineText.style.opacity = '0.8';
      statusLed.classList.add('glow-dot-speaking');
      bars.forEach(b => b.el.classList.add('bar-speaking'));
      micIcon.textContent = 'volume_up';
      break;

    case 'follow_up':
      statusText.textContent = 'AWAITING INPUT';
      pipelineText.textContent = 'Listening...';
      pipelineText.style.opacity = '0.8';
      visualizer.classList.add('waveform-listening');
      micIcon.textContent = 'hearing';
      break;
      
    case 'idle':
    default:
      statusText.textContent = 'SYSTEM IDLE';
      pipelineText.textContent = 'Aether';
      pipelineText.style.opacity = '0.3';
      micIcon.textContent = 'mic_off';
      hideLiveTranscript();
  }
}

function showLiveTranscript(text) {
  liveTranscriptText.textContent = text;
  liveTranscript.classList.remove('hidden');
  inputContainer.classList.add('hidden'); // Hide input while listening
}

function hideLiveTranscript() {
  liveTranscript.classList.add('hidden');
  inputContainer.classList.remove('hidden');
}

function connectWebSocket() {
  if (ws && ws.readyState === WebSocket.OPEN) return;
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${protocol}//${window.location.host}/ws`;

  ws = new WebSocket(url);
  ws.onopen = () => {
    wsIndicator.classList.remove('ws-disconnected');
    wsIndicator.classList.add('text-primary-fixed-dim');
    wsIndicator.title = 'WebSocket: Connected';
    ws.send(JSON.stringify({ type: 'start_pipeline' }));
    pipelineRunning = true;
    setPipelineState('ambient');
  };

  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      switch(data.type) {
        case 'state_change': setPipelineState(data.state); break;
        case 'partial_transcript': showLiveTranscript(data.text); break;
        case 'final_transcript': 
          hideLiveTranscript(); 
          if(data.text) addMessage('You', data.text, 'user'); 
          break;
        case 'response': addMessage('Aether', data.text, 'system'); break;
        case 'error': addMessage('System Error', data.error, 'error'); break;
      }
    } catch(e) {}
  };

  ws.onclose = () => {
    wsIndicator.classList.add('ws-disconnected');
    wsIndicator.classList.remove('text-primary-fixed-dim');
    wsIndicator.title = 'WebSocket: Disconnected';
    if (!wsReconnectTimer) {
      wsReconnectTimer = setTimeout(() => { wsReconnectTimer = null; connectWebSocket(); }, 2000);
    }
  };
}

function wsSend(data) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(data));
}

async function sendCommand(text) {
  if (!text.trim()) return;
  input.value = ''; input.focus();
  addMessage('You', text, 'user');

  if (ws && ws.readyState === WebSocket.OPEN) {
    wsSend({ type: 'text_command', text: text });
  } else {
    // HTTP fallback
    addMessage('System', 'Processing command (HTTP fallback)...', 'system');
    try {
        const res = await fetch('/api/command', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text })
        });
        const data = await res.json();
        if (data.success) {
            addMessage(`Aether`, data.response || 'Task completed.', 'system');
        } else {
            addMessage('System Error', data.response || 'Unknown error occurred.', 'error');
        }
    } catch (e) {
        addMessage('System Error', 'Failed to reach Neural OS.', 'error');
    }
  }
}

sendBtn.addEventListener('click', () => sendCommand(input.value));
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); sendCommand(input.value); }
});

clearBtn.addEventListener('click', () => { chatMessages.innerHTML = ''; });

micBtn.addEventListener('click', () => {
  if (pipelineState === 'speaking') {
    wsSend({ type: 'interrupt' });
  } else if (!pipelineRunning) {
    wsSend({ type: 'start_pipeline' }); pipelineRunning = true;
  } else {
    wsSend({ type: 'stop_pipeline' }); pipelineRunning = false; setPipelineState('idle');
  }
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Escape') wsSend({ type: 'interrupt' });
});

input.focus();
connectWebSocket();
</script>
</body>
</html>
