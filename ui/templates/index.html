<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>J.A.R.V.I.S. — Command Center</title>
<style>
  /* ─── Design tokens ─────────────────────────────────────────── */
  :root{
    --bg:#060a12; --bg2:#0a0f1c;
    --panel:rgba(13,20,34,.62); --panel-solid:#0d1424;
    --border:rgba(0,229,255,.18); --border-hi:rgba(0,229,255,.45);
    --cyan:#00e5ff; --cyan-dim:#5bd6e8; --purple:#b98cff;
    --green:#2ee6a6; --amber:#ffcf5c; --red:#ff6b6b;
    --txt:#e6f0f4; --muted:#8ba0b3; --faint:#5a6b7d;
    --mono:ui-monospace,"Cascadia Code","Consolas",monospace;
    --sans:system-ui,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 800px at 50% -10%,#0d1830 0%,var(--bg) 60%) fixed;
    color:var(--txt); font-family:var(--sans);
    display:flex; flex-direction:column; overflow:hidden; user-select:none;
  }
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:rgba(0,229,255,.28);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(0,229,255,.6)}
  .mono{font-family:var(--mono)}

  /* ─── Header ─────────────────────────────────────────────────── */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; height:58px; flex:0 0 auto;
    background:rgba(6,10,18,.85); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:12px}
  .brand .logo{
    width:34px;height:34px;border-radius:50%;
    border:2px solid var(--cyan); position:relative; flex:0 0 auto;
    box-shadow:0 0 14px rgba(0,229,255,.5), inset 0 0 8px rgba(0,229,255,.4);
    animation:spin 14s linear infinite;
  }
  .brand .logo::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .brand h1{font-size:16px;letter-spacing:3px;font-weight:700;color:var(--cyan)}
  .brand p{font-size:10px;letter-spacing:2px;color:var(--faint);font-family:var(--mono)}

  .pills{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px}
  .pill{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:9px;
        background:var(--panel);border:1px solid var(--border);white-space:nowrap}
  .pill .k{color:var(--faint);font-size:9px;letter-spacing:1px}
  .pill .v{color:var(--txt);font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  .dot.off{background:var(--red);box-shadow:0 0 8px var(--red)}

  /* ─── Layout ─────────────────────────────────────────────────── */
  main{flex:1 1 auto; display:grid; grid-template-columns:1.35fr 1fr; gap:16px;
       padding:16px; min-height:0}
  .col{display:flex;flex-direction:column;gap:16px;min-height:0}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;
         backdrop-filter:blur(16px); box-shadow:0 4px 26px rgba(0,0,0,.4)}
  .panel-h{display:flex;align-items:center;justify-content:space-between;
           padding:11px 15px;border-bottom:1px solid var(--border)}
  .panel-h .title{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:2px;
                  font-weight:700;color:var(--cyan);font-family:var(--mono)}
  .panel-h .sub{font-size:10px;color:var(--faint);font-family:var(--mono)}

  /* ─── Conversation ───────────────────────────────────────────── */
  #convo{flex:1 1 auto; overflow-y:auto; padding:16px; display:flex;
         flex-direction:column; gap:12px; min-height:0}
  .msg{max-width:82%; padding:10px 14px; border-radius:14px; font-size:14px;
       line-height:1.5; animation:rise .25s ease}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .msg .who{font-size:9px;letter-spacing:1.5px;font-family:var(--mono);
            opacity:.7;margin-bottom:3px;text-transform:uppercase}
  .msg.user{align-self:flex-end;background:rgba(0,229,255,.12);
            border:1px solid rgba(0,229,255,.32);border-bottom-right-radius:4px}
  .msg.user .who{color:var(--cyan)}
  .msg.jarvis{align-self:flex-start;background:rgba(185,140,255,.10);
              border:1px solid rgba(185,140,255,.28);border-bottom-left-radius:4px}
  .msg.jarvis .who{color:var(--purple)}
  .msg.sys{align-self:center;background:transparent;border:1px dashed var(--border);
           color:var(--muted);font-size:12px;font-family:var(--mono);max-width:92%}
  .empty{margin:auto;text-align:center;color:var(--faint);font-family:var(--mono);font-size:13px}
  .empty .big{font-size:15px;color:var(--muted);margin-bottom:6px}

  /* ─── State orb ──────────────────────────────────────────────── */
  .orb-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 16px}
  .orb{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center}
  .orb .ring{position:absolute;border-radius:50%;border:2px solid var(--cyan);opacity:.5}
  .orb .r1{inset:0;animation:pulse 3s ease-in-out infinite}
  .orb .r2{inset:18px;border-color:var(--purple);animation:pulse 3s ease-in-out infinite .6s}
  .orb .core{width:78px;height:78px;border-radius:50%;
             background:radial-gradient(circle,rgba(0,229,255,.5),rgba(0,229,255,.05));
             box-shadow:0 0 40px rgba(0,229,255,.5);display:flex;align-items:center;justify-content:center}
  @keyframes pulse{0%,100%{transform:scale(.92);opacity:.4}50%{transform:scale(1.04);opacity:.85}}
  .eq{display:flex;align-items:flex-end;gap:3px;height:26px}
  .eq span{width:4px;background:var(--cyan);border-radius:2px;box-shadow:0 0 6px var(--cyan);height:6px}
  .state-txt{text-align:center}
  .state-txt .s{font-size:20px;letter-spacing:5px;font-weight:700;color:var(--cyan);font-family:var(--mono)}
  .state-txt .d{font-size:10px;letter-spacing:1px;color:var(--muted);font-family:var(--mono);margin-top:3px}
  /* state color themes applied via body[data-state] */
  body[data-state="listening"] .orb .ring,body[data-state="listening"] .state-txt .s{border-color:var(--green);color:var(--green)}
  body[data-state="listening"] .orb .core{box-shadow:0 0 44px rgba(46,230,166,.6);background:radial-gradient(circle,rgba(46,230,166,.5),transparent)}
  body[data-state="listening"] .eq span{background:var(--green);box-shadow:0 0 6px var(--green);animation:eq .5s ease-in-out infinite alternate}
  body[data-state="processing"] .orb .ring,body[data-state="processing"] .state-txt .s{border-color:var(--purple);color:var(--purple)}
  body[data-state="processing"] .orb .core{box-shadow:0 0 44px rgba(185,140,255,.6)}
  body[data-state="speaking"] .state-txt .s{color:var(--cyan)}
  body[data-state="speaking"] .eq span{animation:eq .32s ease-in-out infinite alternate}
  @keyframes eq{to{height:26px}}
  .eq span:nth-child(1){animation-delay:0s}.eq span:nth-child(2){animation-delay:.1s}
  .eq span:nth-child(3){animation-delay:.05s}.eq span:nth-child(4){animation-delay:.15s}
  .eq span:nth-child(5){animation-delay:.08s}
  .partial{min-height:20px;text-align:center;font-family:var(--mono);font-size:13px;
           color:var(--cyan-dim);font-style:italic;padding:0 12px;opacity:.9}

  /* ─── Agent activity feed ────────────────────────────────────── */
  #activity{flex:1 1 auto;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-height:80px}
  .act{display:flex;gap:9px;align-items:flex-start;font-family:var(--mono);font-size:12px;
       padding:7px 10px;border-radius:9px;background:rgba(255,255,255,.03);
       border-left:2px solid var(--faint);animation:rise .2s ease}
  .act .ic{font-size:13px;line-height:1.3}
  .act .tx{color:var(--muted);word-break:break-word}
  .act .tx b{color:var(--txt);font-weight:600}
  .act.plan{border-left-color:var(--purple)} .act.plan .ic{color:var(--purple)}
  .act.tool{border-left-color:var(--cyan)} .act.tool .ic{color:var(--cyan)}
  .act.block{border-left-color:var(--red)} .act.block .tx{color:var(--red)}
  .act.done{border-left-color:var(--green)} .act.done .ic{color:var(--green)}
  .progress{height:4px;background:rgba(255,255,255,.08);border-radius:2px;margin:0 12px 12px;overflow:hidden;display:none}
  .progress .bar{height:100%;width:0;background:var(--cyan);box-shadow:0 0 8px var(--cyan);transition:width .3s}

  /* ─── Vitals ─────────────────────────────────────────────────── */
  .vitals{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px}
  .vital .lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:5px}
  .vital .lbl b{color:var(--txt)}
  .meter{height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--cyan);box-shadow:0 0 6px var(--cyan);transition:width .5s,background .5s}

  /* ─── Command bar ────────────────────────────────────────────── */
  footer{flex:0 0 auto;padding:12px 16px 16px;display:flex;justify-content:center}
  .cmdbar{display:flex;align-items:center;gap:12px;width:100%;max-width:900px;height:56px;
          padding:0 10px 0 12px;border-radius:28px;background:var(--panel-solid);
          border:1px solid var(--border-hi);box-shadow:0 0 24px rgba(0,229,255,.15)}
  .iconbtn{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
           display:flex;align-items:center;justify-content:center;transition:.2s;flex:0 0 auto}
  .mic{background:rgba(0,229,255,.14);color:var(--cyan)}
  .mic:hover{background:rgba(0,229,255,.28)}
  .mic.on{background:rgba(255,107,107,.2);color:var(--red);box-shadow:0 0 14px rgba(255,107,107,.5)}
  .send{background:var(--cyan);color:#04202a}
  .send:hover{background:#66eeff}
  .stop{background:rgba(255,107,107,.16);color:var(--red)}
  .stop:hover{background:rgba(255,107,107,.32);box-shadow:0 0 14px rgba(255,107,107,.5)}
  #cmd{flex:1 1 auto;background:transparent;border:none;outline:none;color:var(--txt);
       font-family:var(--mono);font-size:15px;letter-spacing:.5px}
  #cmd::placeholder{color:var(--faint)}
  svg{width:20px;height:20px;fill:currentColor;display:block}
  @media(max-width:920px){main{grid-template-columns:1fr}.col.right{display:none}}
</style>
</head>
<body data-state="online">

  <header>
    <div class="brand">
      <div class="logo"></div>
      <div>
        <h1>J.A.R.V.I.S.</h1>
        <p id="tagline">NEURAL COMMAND CENTER</p>
      </div>
    </div>
    <div class="pills">
      <div class="pill"><span id="net-dot" class="dot"></span><div><div class="k">AI CORE</div><div class="v" id="provider">—</div></div></div>
      <div class="pill"><div><div class="k">CPU</div><div class="v" id="cpu">0%</div></div></div>
      <div class="pill"><div><div class="k">RAM</div><div class="v" id="ram">0%</div></div></div>
      <div class="pill"><div><div class="k">TOOLS</div><div class="v" id="tools">—</div></div></div>
    </div>
  </header>

  <main>
    <!-- LEFT: conversation -->
    <div class="col">
      <div class="panel" style="flex:1 1 auto;display:flex;flex-direction:column;min-height:0">
        <div class="panel-h">
          <div class="title">▸ CONVERSATION</div>
          <div class="sub" id="convo-sub">say “Hey Jarvis” or type below</div>
        </div>
        <div id="convo">
          <div class="empty">
            <div class="big">Systems online.</div>
            <div>Say <b style="color:var(--cyan)">“Hey Jarvis”</b> or type a command to begin.</div>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: orb + activity + vitals -->
    <div class="col right">
      <div class="panel">
        <div class="orb-wrap">
          <div class="orb">
            <div class="ring r1"></div><div class="ring r2"></div>
            <div class="core"><div class="eq"><span></span><span></span><span></span><span></span><span></span></div></div>
          </div>
          <div class="state-txt">
            <div class="s" id="state">ONLINE</div>
            <div class="d" id="state-sub">all subsystems nominal</div>
          </div>
          <div class="partial" id="partial"></div>
        </div>
      </div>

      <div class="panel" style="flex:1 1 auto;display:flex;flex-direction:column;min-height:0">
        <div class="panel-h">
          <div class="title">▸ AGENT ACTIVITY</div>
          <div class="sub" id="act-sub">live tool execution</div>
        </div>
        <div id="activity">
          <div class="act"><span class="ic">◦</span><span class="tx">Waiting for a command…</span></div>
        </div>
        <div class="progress" id="progress"><div class="bar" id="progress-bar"></div></div>
      </div>

      <div class="panel">
        <div class="vitals">
          <div class="vital"><div class="lbl">CPU LOAD <b id="cpu2">0%</b></div><div class="meter"><i id="cpu-bar"></i></div></div>
          <div class="vital"><div class="lbl">MEMORY <b id="ram2">0%</b></div><div class="meter"><i id="ram-bar"></i></div></div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="cmdbar">
      <button class="iconbtn mic" id="mic" title="Toggle voice listening" onclick="toggleMic()">
        <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
      </button>
      <button class="iconbtn stop" id="stop" title="Emergency stop — halt all tasks" onclick="emergencyStop()">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v10H7z"/></svg>
      </button>
      <input id="cmd" placeholder="Speak or type a command…" autocomplete="off"
             onkeydown="if(event.key==='Enter')send()"/>
      <button class="iconbtn send" title="Send" onclick="send()">
        <svg viewBox="0 0 24 24"><path d="M3 20.5v-6l8-2.5-8-2.5v-6l19 8.5-19 8.5Z"/></svg>
      </button>
    </div>
  </footer>

<script>
(function(){
  "use strict";
  let ws=null, listening=false, hasMsg=false;
  const $=id=>document.getElementById(id);

  /* ── WebSocket with auto-reconnect ── */
  function connect(){
    const proto=location.protocol==="https:"?"wss:":"ws:";
    try{
      ws=new WebSocket(`${proto}//${location.host}/ws`);
      ws.onopen=()=>setState("online");
      ws.onmessage=e=>{ try{handle(JSON.parse(e.data));}catch(_){} };
      ws.onclose=()=>{ setState("offline"); setTimeout(connect,2500); };
      ws.onerror=()=>{ try{ws.close();}catch(_){} };
    }catch(_){ setTimeout(connect,2500); }
  }

  function handle(m){
    switch(m.type){
      case "state_change": setState(m.state); break;
      case "partial_transcript": $("partial").textContent=m.text?`“${m.text}”`:""; break;
      case "final_transcript":
        if(m.text){ addMsg("user",m.text); $("partial").textContent=""; }
        break;
      case "response": if(m.text) addMsg("jarvis",m.text); break;
      case "error": addActivity("block","⛔",`Error: ${m.error||"unknown"}`); break;
      case "system_telemetry": telemetry(m); break;
      case "bus_event": busEvent(m); break;
    }
  }

  /* ── State orb ── */
  const SUBS={online:"all subsystems nominal",listening:"capturing audio…",
    processing:"reasoning & orchestrating…",speaking:"responding…",
    follow_up:"listening for follow-up…",offline:"reconnecting to core…",ambient:"standing by — say “Jarvis”"};
  function setState(s){
    s=(s||"online").toLowerCase();
    const norm=(s==="ambient")?"online":s;
    document.body.dataset.state=norm;
    $("state").textContent=(s==="follow_up"?"FOLLOW-UP":s.toUpperCase());
    $("state-sub").textContent=SUBS[s]||"";
    const off=(s==="offline");
    $("net-dot").classList.toggle("off",off);
    if(norm!=="listening") { /* keep mic button synced to real pipeline only on explicit toggle */ }
  }

  /* ── Conversation ── */
  function addMsg(who,text){
    const c=$("convo");
    if(!hasMsg){ c.innerHTML=""; hasMsg=true; }
    const d=document.createElement("div");
    d.className=`msg ${who}`;
    const label=who==="user"?"You":(who==="jarvis"?"Jarvis":"System");
    d.innerHTML=`<div class="who">${label}</div><div class="bd"></div>`;
    d.querySelector(".bd").textContent=text;
    c.appendChild(d); c.scrollTop=c.scrollHeight;
  }

  /* ── Agent activity feed ── */
  function addActivity(cls,icon,html){
    const a=$("activity");
    if(a.dataset.fresh!=="1"){ a.innerHTML=""; a.dataset.fresh="1"; }
    const d=document.createElement("div");
    d.className=`act ${cls}`;
    d.innerHTML=`<span class="ic">${icon}</span><span class="tx">${html}</span>`;
    a.appendChild(d);
    while(a.children.length>40) a.removeChild(a.firstChild);
    a.scrollTop=a.scrollHeight;
  }
  function esc(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

  function busEvent(m){
    const p=m.payload||{}, topic=m.topic;
    if(topic==="agentic_start"){
      addActivity("plan","🧠",`Planning: <b>${esc(p.goal)}</b>`);
    }else if(topic==="tool_executed"){
      addActivity("tool","⚙",`Ran <b>${esc(p.tool)}</b>`);
    }else if(topic==="agentic_blocked"){
      addActivity("block","⛔",`Blocked <b>${esc(p.tool)}</b> — needs your confirmation`);
    }else if(topic==="emergency_stop"){
      addActivity("block","⛔","<b>Emergency stop engaged</b> — all tasks halted");
    }else if(topic==="task_execute_automation"){
      const pct=parseInt(p.percent||0,10);
      const pr=$("progress"), bar=$("progress-bar");
      pr.style.display="block"; bar.style.width=pct+"%";
      $("act-sub").textContent=esc(p.status||"");
      if(pct>=100) setTimeout(()=>{pr.style.display="none";bar.style.width="0";$("act-sub").textContent="live tool execution";},1500);
    }
  }

  /* ── Telemetry ── */
  function telemetry(m){
    if(m.cpu!=null){ $("cpu").textContent=Math.round(m.cpu)+"%"; $("cpu2").textContent=Math.round(m.cpu)+"%"; meter("cpu-bar",m.cpu); }
    if(m.ram!=null){ $("ram").textContent=Math.round(m.ram)+"%"; $("ram2").textContent=Math.round(m.ram)+"%"; meter("ram-bar",m.ram); }
    if(m.provider){ $("provider").textContent=m.provider; }
    if(m.online!=null){ $("net-dot").classList.toggle("off",!m.online); }
  }
  function meter(id,v){
    const el=$(id); el.style.width=Math.min(100,v)+"%";
    el.style.background=v>85?"var(--red)":v>60?"var(--amber)":"var(--cyan)";
    el.style.boxShadow=`0 0 6px ${v>85?"var(--red)":v>60?"var(--amber)":"var(--cyan)"}`;
  }

  /* ── Actions ── */
  window.send=function(){
    const i=$("cmd"), t=i.value.trim();
    if(!t) return;
    i.value="";
    addMsg("user",t);
    fetch("/api/command",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text:t})}).catch(()=>addActivity("block","⛔","Failed to reach core."));
  };
  window.emergencyStop=function(){
    fetch("/api/emergency_stop",{method:"POST"}).catch(()=>{});
    addActivity("block","⛔","<b>EMERGENCY STOP</b> — halting all tasks");
    setState("online");
  };
  window.toggleMic=function(){
    listening=!listening;
    $("mic").classList.toggle("on",listening);
    fetch(`/api/pipeline/${listening?"start":"stop"}`,{method:"POST"}).catch(()=>{});
    addActivity("tool", listening?"🎙":"⏹", listening?"Voice listening <b>enabled</b>":"Voice listening <b>paused</b>");
  };

  /* ── Boot ── */
  async function bootStatus(){
    try{
      const r=await fetch("/api/status"); const d=await r.json();
      if(d.tools_count) $("tools").textContent=d.tools_count;
      if(d.cpu_percent!=null) telemetry({cpu:d.cpu_percent,ram:d.ram_percent});
    }catch(_){}
  }
  connect(); bootStatus();
})();
</script>
</body>
</html>
