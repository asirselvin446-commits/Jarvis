[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-os"
version = "1.0.0"
description = "Enterprise-grade autonomous AI agent platform with voice, vision, and task orchestration"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Jarvis Contributors", email = "dev@jarvis-os.io"}
]
keywords = ["ai", "agent", "voice", "vision", "orchestration", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Monitoring",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "requests>=2.28.0",
    "psutil>=5.9.0",
    "numpy>=1.21.0",
    "sounddevice>=0.4.5",
    "librosa>=0.10.0",
    "scipy>=1.7.0",
    "python-dotenv>=0.19.0",
    "pydantic>=1.9.0",
]

[project.optional-dependencies]
cloud = [
    "google-cloud-speech>=2.20.0",
    "google-cloud-texttospeech>=2.14.0",
]
vision = [
    "opencv-python>=4.5.0",
    "pillow>=9.0.0",
]
ml = [
    "scikit-learn>=1.0.0",
    "torch>=1.10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

[project.urls]
Homepage = "https://github.com/asirselvin446-commits/Jarvis"
Documentation = "https://github.com/asirselvin446-commits/Jarvis/wiki"
Repository = "https://github.com/asirselvin446-commits/Jarvis.git"
Issues = "https://github.com/asirselvin446-commits/Jarvis/issues"

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-config = "jarvis.config:config_wizard"
jarvis-setup = "jarvis.setup:setup_wizard"

[tool.setuptools]
packages = ["jarvis", "jarvis.core", "jarvis.plugins"]

[tool.setuptools.package-data]
jarvis = [
    "config/default.json",
    "config/settings.json.template",
]
